components:
  schemas:
    CrawlRequest:
      properties:
        url:
          type: string
          maxLength: 2048
          title: Url
          description: Where to start (e.g., https://example.com)
        max_pages:
          title: Max Pages
          description: Fewer pages than your plan's cap, if you want
          type: integer
          maximum: 100.0
          minimum: 1.0
          nullable: true
      type: object
      required:
      - url
      title: CrawlRequest
    DeepAuditRequest:
      properties:
        url:
          type: string
          title: Url
          description: Page to audit (scheme optional). Must be a public http(s) address.
        business_type:
          title: Business Type
          description: 'Tunes which checks apply: saas | local_service | ecommerce | storefront | blog | publisher. Inferred
            when omitted.'
          type: string
          nullable: true
        is_local:
          title: Is Local
          description: Force local-business checks (NAP, LocalBusiness schema).
          type: boolean
          nullable: true
        webhook_url:
          title: Webhook Url
          description: 'Optional public URL POSTed once when the job completes. Single attempt, no retries, no signature:
            keep polling as the source of truth.'
          type: string
          nullable: true
      additionalProperties: true
      type: object
      required:
      - url
      title: DeepAuditRequest
      description: Start a Deep Site Audit. Unknown fields are passed to the engine untouched.
      example:
        business_type: local_service
        url: https://example.com
        webhook_url: https://yourapp.example/hooks/deep-audit
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Check:
      type: object
      description: One check. Always has a name and a status; other fields depend on the check.
      properties:
        name:
          type: string
        status:
          type: string
          description: pass, warning, fail or info
        detail:
          type: string
      additionalProperties: true
    CategoryBlock:
      type: object
      properties:
        score:
          type: number
        checks:
          type: array
          items:
            $ref: '#/components/schemas/Check'
    Priority:
      type: object
      properties:
        severity:
          type: string
          enum:
          - high
          - medium
          - low
        category:
          type: string
        issue:
          type: string
        fix:
          type: string
          description: What to change.
        plain_english:
          type: string
          description: One sentence without jargon.
        who_fixes_it:
          type: string
          enum:
          - developer
          - content
          - marketing
    AiReadability:
      type: object
      properties:
        url:
          type: string
        ai_readability_score:
          type: number
          description: 0 to 100.
        ai_readability_grade:
          type: string
        categories:
          type: object
          description: crawl_accessibility, structural_markup, content_extractability, ai_discoverability. Each has score,
            max and checks.
          additionalProperties:
            type: object
            properties:
              score:
                type: number
              max:
                type: number
              checks:
                type: array
                items:
                  $ref: '#/components/schemas/Check'
        recommendations:
          type: array
          items:
            type: object
            additionalProperties: true
    AuditResponse:
      type: object
      properties:
        url:
          type: string
        score:
          type: number
          description: Overall SEO score, 0 to 100.
        grade:
          type: string
          description: Letter grade, A+ to F.
        response_code:
          type: integer
          description: HTTP status the audited page returned.
        response_time:
          type: string
        html_truncated:
          type: boolean
        audit:
          type: object
          description: 'Category breakdown: meta, technical, social, performance, accessibility.'
          additionalProperties:
            $ref: '#/components/schemas/CategoryBlock'
        priorities:
          type: array
          description: Fixes in priority order.
          items:
            $ref: '#/components/schemas/Priority'
        ai_readability:
          $ref: '#/components/schemas/AiReadability'
        core_web_vitals:
          type: object
          description: Measured with `cwv=true`; `status` is `unavailable` with a `reason` when there is no measurement.
          additionalProperties: true
        sxo:
          type: object
          description: SXO score block (paid plans).
          properties:
            sxo_score:
              type: number
            sxo_grade:
              type: string
            summary:
              type: string
            checks:
              type: array
              items:
                $ref: '#/components/schemas/Check'
        aeo:
          type: object
          description: AEO score block (paid plans).
          properties:
            aeo_score:
              type: number
            aeo_grade:
              type: string
            summary:
              type: string
            checks:
              type: array
              items:
                $ref: '#/components/schemas/Check'
        aio:
          type: object
          description: AIO score block (paid plans).
          properties:
            aio_score:
              type: number
            aio_grade:
              type: string
            summary:
              type: string
            checks:
              type: array
              items:
                $ref: '#/components/schemas/Check'
        history:
          type: object
          description: Change since the previous audit of this URL by the same key (paid plans).
          additionalProperties: true
    Error:
      type: object
      properties:
        detail:
          type: string
        reason:
          type: string
          description: 'Machine-readable cause when the page could not be loaded: blocked, timeout, dns, tls, unreachable,
            not_found, http_error, non_html, redirect_loop, blocked_url, invalid_url, load_failed.'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your SEO Score API key. Free at https://seoscoreapi.com/#signup.
