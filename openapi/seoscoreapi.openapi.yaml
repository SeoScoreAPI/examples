          description: Your brand name. Adds the reputation and pricing questions that name you
          title: Brand
          type: string
          nullable: true
        description: Your brand name. Adds the reputation and pricing questions that name you
        example: Acme
      - name: competitors
        in: query
        required: false
        schema:
          description: Comma-separated competitor names (up to 5). Adds `X vs Y` and `alternatives to X`
          title: Competitors
          type: string
          nullable: true
        description: Comma-separated competitor names (up to 5). Adds `X vs Y` and `alternatives to X`
        example: Rival One,Rival Two
      - name: audience
        in: query
        required: false
        schema:
          description: 'Who buys it, plural: `marketing agencies`, `homeowners`'
          title: Audience
          type: string
          nullable: true
        description: 'Who buys it, plural: `marketing agencies`, `homeowners`'
        example: marketing agencies
      - name: features
        in: query
        required: false
        schema:
          description: 'Comma-separated features buyers ask about (up to 6): `a free tier, PDF reports`'
          title: Features
          type: string
          nullable: true
        description: 'Comma-separated features buyers ask about (up to 6): `a free tier, PDF reports`'
        example: a free tier,PDF reports
      - name: use_cases
        in: query
        required: false
        schema:
          description: 'Comma-separated jobs it is bought for (up to 6): `CI/CD checks`'
          title: Use Cases
          type: string
          nullable: true
        description: 'Comma-separated jobs it is bought for (up to 6): `CI/CD checks`'
        example: CI/CD checks
      - name: per_category
        in: query
        required: false
        schema:
          type: integer
          maximum: 10
          minimum: 1
          description: Prompts per category (default 2 = 12 prompts; 3 = 18)
          default: 2
          title: Per Category
        description: Prompts per category (default 2 = 12 prompts; 3 = 18)
        example: 2
      - name: limit
        in: query
        required: false
        schema:
          description: Cut the list to this many, keeping the spread across categories (use your plan's tracked-prompt limit)
          title: Limit
          type: integer
          maximum: 60
          minimum: 1
          nullable: true
        description: Cut the list to this many, keeping the spread across categories (use your plan's tracked-prompt limit)
        example: 12
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
