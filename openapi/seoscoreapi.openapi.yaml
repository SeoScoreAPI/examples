openapi: 3.0.3
info:
  title: SEO Score API
  version: 1.0.0
  description: 'SEO Score API audits a web page and returns the result as JSON: an overall score from 0 to

    100, a letter grade, a score per category, AI readability and answer-engine scores, and a

    prioritized fix list. Every fix has a severity, a plain instruction, a jargon-free

    `plain_english` sentence and `who_fixes_it` (developer, content or marketing).


    - **80+ checks** per URL on paid plans; free keys are scored on 50+.

    - **Accessibility:** automated WCAG 2.1 A/AA checks with the affected elements.

    - **AI readiness:** AI readability, GEO audits, llms.txt generation and AI citation tracking.

    - **Monitoring:** scheduled re-audits that alert by email or webhook.


    **Authentication:** send your key in the `X-API-Key` header. A free key (20 audits a month,

    no credit card) comes from https://seoscoreapi.com/#signup, or from `POST /signup` then

    `POST /verify`. Plans and limits: https://seoscoreapi.com/#pricing.


    Client libraries: Python (`pip install seoscoreapi`), Node.js (`npm install seoscoreapi`),

    Go (`github.com/SeoScoreAPI/go-client`), an n8n node, a GitHub Action and an MCP server.

    '
  termsOfService: https://seoscoreapi.com/terms
  contact:
    name: SEO Score API
    url: https://seoscoreapi.com
    email: info@seoscoreapi.com
  x-logo:
    url: https://raw.githubusercontent.com/SeoScoreAPI/examples/master/assets/seoscore-icon-512.png
    backgroundColor: '#FFFFFF'
externalDocs:
  description: Documentation
  url: https://seoscoreapi.com/docs
servers:
- url: https://seoscoreapi.com
security:
- ApiKeyAuth: []
tags:
- name: Audit
  description: 'Score one page or several: 80+ checks, a 0 to 100 score, a grade and a prioritized fix list.'
- name: Accessibility
  description: Automated WCAG 2.1 A/AA checks. Automated testing does not catch everything.
- name: AI readiness
  description: How well AI systems and answer engines can read, cite and reuse a page.
- name: Page analysis
  description: Trackers, conversion, Search Console quick wins and backlinks.
- name: Site crawl
  description: Crawl a site and score its pages (asynchronous).
- name: Deep Site Audit
  description: Asynchronous audit from a catalog of 14,000+ checks.
- name: AI Citations
  description: Track whether AI assistants mention and cite your brand.
- name: History
  description: Score history and trends.
- name: Monitoring
  description: Scheduled re-audits with alerts by email or webhook (Slack incoming webhooks are formatted automatically).
- name: Account
  description: Get a key, check usage.
paths:
  /site-audit:
    post:
      tags:
      - Deep Site Audit
      summary: Start a Deep Site Audit
      description: 'Queue a Deep Site Audit of one URL and get a `job_id` back immediately.


        The audit fetches the page and its supporting signals (robots.txt, sitemap,

        DNS, TLS, PageSpeed), runs the thousands of catalog checks that apply to it, then an AI analysis pass of up to 150
        checks. It takes

        about 90 seconds once it starts, so poll `GET /site-audit/{job_id}`.


        **Included on Pro (20/month) and Ultra (100/month).** Any other key spends one

        purchased Deep Audit credit per audit. A failed audit gives its quota unit or

        credit back.'
      operationId: startDeepAudit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeepAuditRequest'
            example:
              url: https://seoscoreapi.com
              business_type: saas
      responses:
        '200':
          description: Job queued.
          content:
            application/json:
              schema: {}
              example:
                job_id: 3f9c2a7e1b5d4c8f9a0e6b2d7c1f4a93
                status: queued
                poll: /site-audit/3f9c2a7e1b5d4c8f9a0e6b2d7c1f4a93
        '400':
          description: URL or webhook refused (not a public http(s) address).
        '402':
          description: No Deep Audit credits left (keys without Pro/Ultra). Buy a credit pack or upgrade.
        '401':
          description: Missing or invalid API key.
        '429':
          description: Rate limit, monthly quota, or queue backpressure. Honour `Retry-After`.
        '503':
          description: Engine temporarily unavailable. Retry after `Retry-After` seconds.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /deep-audit/usage:
    get:
      tags:
      - Deep Site Audit
      summary: Deep Site Audit allowance for this key
      description: 'Deep Site Audits used and remaining this calendar month (UTC) for this key.


        Separate from `GET /usage`, which reports the per-URL audit allowance. Keys

        without Pro/Ultra show `remaining: 0` here and run on credits instead; see

        your dashboard for the credit balance.'
      operationId: deepAuditUsage
      responses:
        '200':
          description: This month's Deep Site Audit usage.
          content:
            application/json:
              schema: {}
              example:
                tier: pro
                site_audit:
                  used: 3
                  remaining: 17
                serp:
                  used: 0
                  remaining: 250
        '401':
          description: Missing or invalid API key.
        '429':
          description: Rate limit, monthly quota, or queue backpressure. Honour `Retry-After`.
        '503':
          description: Engine temporarily unavailable. Retry after `Retry-After` seconds.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /site-audit/{job_id}:
    get:
      tags:
      - Deep Site Audit
      summary: Poll a Deep Site Audit
      description: 'Status of a Deep Site Audit: `queued` (with `queue_position` and

        `eta_seconds`), `running` (with `progress` 0-100 and `stage`), `completed`

        (with `result`) or `failed` (with `error`). Poll every 5-10 seconds. Only the

        key that started a job can read it.'
      operationId: getDeepAudit
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
        example: JOB_ID_FROM_START
      responses:
        '200':
          description: Job state. `result` is present once `status` is `completed`.
          content:
            application/json:
              schema: {}
              examples:
                queued:
                  value:
                    job_id: 3f9c…
                    status: queued
                    progress: 0
                    queue_position: 2
                    eta_seconds: 150
                running:
                  value:
                    job_id: 3f9c…
                    status: running
                    progress: 60
                    stage: Section 6
                completed:
                  value:
                    job_id: 3f9c…
                    status: completed
                    progress: 100
                    stage: done
                    result:
                      website_url: https://example.com
                      scores:
                        lai_score: 3.23
                        lai_grade: fair
                        seo_score: 2.53
                        ai_score: 3.66
                        section_scores:
                          '1': 4.37
                          '2': 2.69
                          '9': 1.04
                        tasks_scored: 5782
                        tasks_failed: 1779
                      sections:
                        '1':
                          name: Technical Foundation & Rendering
                          score: 4.37
                      findings:
                      - task_id: 2.2.01
                        section: 2
                        severity: high
                        weight: critical
                        evidence: No XML sitemap found
                        count: 1
                      coverage:
                        scored_tasks: 5782
                        hybrid_ai_tasks: 150
                        total_tasks: 14385
                failed:
                  value:
                    job_id: 3f9c…
                    status: failed
                    progress: 40
                    stage: Section 4
                    error: …
        '404':
          description: Unknown job, or a job started by a different key.
        '401':
          description: Missing or invalid API key.
        '429':
          description: Rate limit, monthly quota, or queue backpressure. Honour `Retry-After`.
        '503':
          description: Engine temporarily unavailable. Retry after `Retry-After` seconds.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /health:
    get:
      summary: Service health
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Account
      security: []
  /signup:
    post:
      summary: Request a free API key (emails a code)
      description: 'Start signup: send a verification code to your email. Send JSON: {"email": "you@example.com"}'
      operationId: signup
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
            example:
              email: you@example.com
      tags:
      - Account
      security: []
  /verify:
    post:
      summary: Verify the emailed code and receive the key
      description: 'Complete signup: verify your code and get your API key. Send JSON: {"email": "you@example.com", "code":
        "123456"}'
      operationId: verifySignup
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
              required:
              - email
              - code
            example:
              email: you@example.com
              code: '123456'
      tags:
      - Account
      security: []
  /usage:
    get:
      summary: Usage and plan limits for this key
      description: Check your API usage and limits.
      operationId: getUsage
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Account
      security:
      - ApiKeyAuth: []
  /ai-readability:
    get:
      summary: AI readability score of one URL
      description: Score how well a page can be consumed by AI/LLM systems. Requires an API key.
      operationId: aiReadability
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          description: The URL to analyze for AI readability
          title: Url
        description: The URL to analyze for AI readability
        example: https://seoscoreapi.com
      responses:
        '200':
          description: The AI readability result. The example is a real result for https://seoscoreapi.com with each `checks`
            list cut to two entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReadability'
              example:
                url: https://seoscoreapi.com
                ai_readability_score: 95
                ai_readability_grade: A+
                categories:
                  crawl_accessibility:
                    score: 25
                    max: 25
                    checks:
                    - name: ssr_content
                      status: pass
                      score: 8
                      max: 8
                      detail: Server-rendered content detected
                    - name: ai_bot_access
                      status: pass
                      score: 5
                      max: 5
                      detail: All major AI bots allowed
                  structural_markup:
                    score: 24
                    max: 25
                    checks:
                    - name: schema_jsonld
                      status: pass
                      score: 8
                      max: 8
                      detail: 'Types: SoftwareApplication, Organization, FAQPage, Product, WebSite'
                    - name: semantic_html
                      status: pass
                      score: 5
                      max: 5
                      detail: 46 semantic elements, 22 divs (68% ratio)
                  content_extractability:
                    score: 26
                    max: 30
                    checks:
                    - name: answer_first
                      status: pass
                      score: 6
                      max: 6
                      detail: 6/6 sections lead with facts
                    - name: chunk_friendly
                      status: warning
                      score: 3
                      max: 6
                      detail: 3/6 — sections sized for RAG chunking
                  ai_discoverability:
                    score: 20
                    max: 20
                    checks:
                    - name: open_graph
                      status: pass
                      score: 4
                      max: 4
                      detail: 5/5 OG tags present
                    - name: semantic_urls
                      status: pass
                      score: 3
                      max: 3
                      detail: /
                recommendations: []
        '400':
          description: The URL was refused before any audit ran (malformed, or a private or internal address).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Invalid URL
                reason: invalid_url
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Invalid or inactive API key. Get one at POST /signup
        '422':
          description: The page could not be loaded, so there is nothing to score. `reason` says why. Also returned when `url`
            is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: The site refused our crawler.
                reason: blocked
        '429':
          description: Rate limit or plan quota reached. Wait for `Retry-After` when present, or upgrade the plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Rate limit exceeded
      tags:
      - AI readiness
      security:
      - ApiKeyAuth: []
  /trackers:
    get:
      summary: Tracking pixels and tags on a page
      description: 'List the third-party trackers and pixels a page loads.


        Loads the page in a real browser, waits a few seconds, and reports every analytics,

        advertising, session-replay, chat, marketing-automation, A/B-testing and monitoring

        tool it saw, including pixels a tag manager injects (which never appear in the page

        source).


        Each item in `trackers` has `vendor`, `category`, `found_in` (`html`, `network`),

        `injected` (seen on the network but not in the source), `requests`,

        `transfer_bytes`, `evidence` (up to 3 URLs) and, where one is exposed, `ids`

        (a GA4, GTM or Google Ads id). `summary` totals them by category and names the

        `consent_manager` on the page, if any.


        This lists what loaded during one visit with no interaction. It does not determine

        whether a tracker waited for consent, and it is not legal advice.


        Counts as one audit against your plan. A page we can''t load returns **422** with

        `reason`, and is not counted.'
      operationId: trackerInventory
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          description: The page to inspect (e.g., https://example.com)
          title: Url
        description: The page to inspect (e.g., https://example.com)
        example: https://seoscoreapi.com
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Page analysis
      security:
      - ApiKeyAuth: []
  /conversion:
    get:
      summary: Conversion score of a page
      description: "Score how well a page turns a visitor into a lead or a sale.\n\nReads the page's HTML (the same fetch\
        \ `/audit` uses: plain HTTP, then a real browser\nwhen the page is built by JavaScript) and scores five areas from\
        \ 0 to 100:\n\n- `headline`: one H1 that says what the page offers, with a sentence under it\n- `cta`: a call to action\
        \ near the top, worded as an action, repeated down the page.\n  A phone link and \"Add to cart\" both count\n- `trust`:\
        \ testimonials, ratings, guarantees, contact details, credentials\n- `forms`: how many fields the form asks for, and\
        \ whether they are labeled\n- `objections`: price or a path to it, FAQ, what happens next, shipping and returns\n\n\
        Returns `score`, `grade`, `page_type`, `categories` (per-area score, weight and\nchecks), `signals` (what we found:\
        \ the H1, the button labels, the trust evidence)\nand `priorities`, the fix list. Every priority has `severity`, `category`,\
        \ `issue`,\n`fix`, `plain_english` and `who_fixes_it` (`developer` | `content` | `marketing`),\nplus `evidence` where\
        \ there is some.\n\n**What it does not do.** It does not measure your conversion rate; only your\nanalytics can. \"\
        Near the top\" is source order, not pixels: we do not lay the page\nout. A form embedded from another service (HubSpot,\
        \ Calendly, Typeform) is reported\nbut not scored, and a page with no form is not marked down for it: `forms.score`\n\
        is `null` and its weight goes to the other areas. A page over 3 MB is scored on what\nwe read, and nothing is reported\
        \ as missing.\n\nCounts as one audit against your plan. A page we can't load or can't read returns\n**422** with `reason`\
        \ and is not counted. Free keys get the scores and the first\ntwo priorities; paid plans get the full list. `?include=conversion`\
        \ on `/audit`\n(paid plans) adds the same block to an audit at no extra charge."
      operationId: conversionScore
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          description: The page to score (e.g., https://example.com/services)
          title: Url
        description: The page to score (e.g., https://example.com/services)
        example: https://seoscoreapi.com
      - name: page_type
        in: query
        required: false
        schema:
          description: '`local_service`, `ecommerce`, `saas` or `general`. Detected from the page when omitted.'
          title: Page Type
          type: string
          nullable: true
        description: '`local_service`, `ecommerce`, `saas` or `general`. Detected from the page when omitted.'
        example: saas
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Page analysis
      security:
      - ApiKeyAuth: []
  /quick-wins:
    post:
      summary: Page-two quick wins from your Search Console rows
      description: "Find the page-2 quick wins in your Search Console data.\n\nSend your own Search Console rows and get back\
        \ the queries ranking 11-20 that are\nworth working on first, each with the page it lands on, an opportunity score\
        \ and an\nestimate of the extra clicks from moving it onto page 1.\n\n**We do not connect to your Search Console.**\
        \ You export the rows (Performance\nreport CSV, or the Search Analytics API with the `query` and `page` dimensions)\n\
        and send them. Nothing is fetched and nothing is stored.\n\nSend JSON with either `rows` or `csv`:\n\n- `rows`: `[{\"\
        query\": \"...\", \"page\": \"https://...\", \"clicks\": 3, \"impressions\": 900, \"position\": 11.4}]`.\n  The API's\
        \ own shape (`{\"keys\": [\"query\", \"page\"], \"clicks\": ...}`) works too. `page` is optional.\n- `csv`: the export\
        \ as text, with a header row. Column names are matched\n  (`Top queries`/`Query`, `Page`, `Clicks`, `Impressions`,\
        \ `Position`).\n- `min_impressions` (default 50), `target_position` (1-10, default 5), `limit` (default 25, max 200)\n\
        - `exclude_terms`: words to leave out, such as your brand name\n- `ctr_curve`: your own expected click-through rate\
        \ by position, `{\"1\": 0.28, \"2\": 0.15}`\n\nEach item in `quick_wins` has `query`, `page`, `position`, `impressions`,\
        \ `clicks`,\n`ctr`, `expected_ctr`, `opportunity_score` (0-100: 40% how close to page 1, 40%\nimpressions, 20% how\
        \ far clicks fall short of expected), `estimated_extra_clicks`\nat the target position with a range (position 10 to\
        \ position 3), an `action`\n(`small_push`, `improve_page`, `fix_snippet`, `consolidate`) and a `plain_english`\nsentence.\
        \ `also_ranking_pages` lists other pages of yours showing for the same query.\n`pages` groups the wins by landing\
        \ page.\n\n**Read the numbers as estimates.** Google publishes no click-through curve; the\ndefault is a rough one.\
        \ Extra clicks hold impressions constant and assume every\nimpression is a person. Position is an average over the\
        \ export's dates, countries\nand devices.\n\n**Send the whole export, not only page 2.** With 500 or more page-1 impressions\
        \ in\nthe rows, `ctr_calibration` compares the clicks your page-1 results earned with\nwhat the curve predicts (`ratio`),\
        \ and each win also gets\n`estimated_extra_clicks_calibrated` (the estimate times that ratio). A ratio far\nbelow\
        \ 1 usually means many of the impressions are rank trackers or bots.\n\nWorks on every plan. Counts as one audit;\
        \ a request we reject (400) is not counted.\nUp to 1 MB of JSON per request (roughly 5,000 rows with URLs); filter\
        \ the export\nto positions 11-20 first if yours is larger."
      operationId: quickWins
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rows:
                  type: array
                  items:
                    type: object
                  description: 'Search Console rows: query, page (optional), clicks, impressions, position.'
                csv:
                  type: string
                  description: The Performance export as text, with its header row. Send rows or csv.
                min_impressions:
                  type: integer
                  default: 50
                target_position:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 5
                limit:
                  type: integer
                  maximum: 200
                  default: 25
                exclude_terms:
                  type: array
                  items:
                    type: string
                ctr_curve:
                  type: object
                  additionalProperties:
                    type: number
                  description: Expected click-through rate by position.
            example:
              rows:
              - query: seo audit api
                page: https://example.com/
                clicks: 3
                impressions: 900
                position: 11.4
      tags:
      - Page analysis
      security:
      - ApiKeyAuth: []
  /crawl:
    post:
      summary: Start a site crawl
      description: 'Start a multi-page crawl of one site (async).


        Follows same-site links from `url`, plus the URLs in the sitemap, up to your page cap,

        and reports broken pages, redirects, duplicate titles and headings, pages missing a

        title or heading, orphan pages (in the sitemap, linked from nowhere crawled) and slow

        pages. Plain HTTP requests, 4 at a time, robots.txt honoured.


        **Limits.** Pro: 25 pages per crawl, 20 crawls a month. Ultra: 100 pages, 100 crawls a

        month. Any other plan: one Deep Audit credit covers a 25-page crawl. A failed crawl is

        not counted and a credit is returned.


        Returns `job_id`; poll `GET /crawl/{job_id}`. `site_map` is a shareable page with the

        site diagram once the crawl has finished.'
      operationId: startCrawl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrawlRequest'
            example:
              url: https://seoscoreapi.com
              max_pages: 10
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Site crawl
      security:
      - ApiKeyAuth: []
  /crawl/{job_id}:
    get:
      summary: Get a site crawl
      description: 'Poll a site crawl. `status` is `queued`, `running`, `completed` or `failed`.


        While running, `pages_done` counts up. When completed, `result` holds `summary`,

        `issues` (broken_links, redirects, duplicate_titles, duplicate_h1, missing_title,

        missing_h1, orphan_pages, slow_pages, noindex_pages, rate_limited), `pages` (one row

        per URL: status, depth, redirects, response_ms, title, h1, canonical, inlinks) and

        `links` (the internal link graph). Only the key that started a crawl can read it.'
      operationId: getCrawl
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
        example: JOB_ID_FROM_START
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Site crawl
      security:
      - ApiKeyAuth: []
  /audit:
    get:
      summary: SEO audit of one URL
      description: "Run a comprehensive SEO audit on any URL.\n\nReturns an overall score (0–100), letter grade, prioritized\
        \ fix\nrecommendations, and a `audit` block of category breakdowns\n(SEO, performance, accessibility, AI readability).\n\
        \nPaid plans (Starter $5/mo and up) additionally receive:\n  - `sxo`, `aeo`, `aio` — extended scoring blocks\n  -\
        \ `history` — delta vs the previous audit for this URL\n    (overall score, grade change, per-category deltas, days\
        \ since)\n  - Full priorities list and uncapped per-category checks\n\nEvery priority carries `plain_english` (one\
        \ jargon-free sentence) and\n`who_fixes_it` (`developer` | `content` | `marketing`) next to `issue`/`fix`.\n\n`?include=trackers`\
        \ (paid plans) adds a `trackers` block: the same inventory as\n`GET /trackers`, at no extra audit. It adds a few seconds.\n\
        \n`?include=conversion` (paid plans) adds a `conversion` block: the same score and\nfix list as `GET /conversion`,\
        \ at no extra audit. Combine them: `?include=trackers,conversion`.\n\nFree / demo keys see gated placeholders for\
        \ the paid blocks\n(`_extended_gated`, `history._gated`, `_priorities_gated`).\n\n**Core Web Vitals are opt-in: `?cwv=true`**\
        \ (every plan, no extra charge, never\npart of the score). The response always carries a `core_web_vitals` object\
        \ with\n`lcp_ms`, `inp_ms`, `cls`, `fcp_ms`, `ttfb_ms`, `checks` and a `status`:\n\n  - `not_requested` (the default):\
        \ no measurement was made; the metrics are\n    `null` and `hint` says how to ask. A default audit never waits on\
        \ PageSpeed.\n  - `ok`: measured by Google PageSpeed Insights. `source` is `field` (real-user\n    Chrome UX Report\
        \ data) or `lab`; `_cached: true` when it came from the\n    24 hour cache. A cached measurement is included even\
        \ without `cwv=true`,\n    because it costs no time.\n  - `unavailable`: `cwv=true` was set but PageSpeed failed,\
        \ rate limited us or\n    was too slow; `reason` says which. The audit itself still succeeds.\n  - `unavailable` with\
        \ `pending: true`: PageSpeed was still measuring when the\n    wait ran out (about 25 seconds). The measurement finishes\
        \ in the\n    background; the next audit of that URL has it.\n\nWith `cwv=true` the first audit of a URL takes about\
        \ 10 seconds longer; repeats\nwithin 24 hours are instant. Set your client timeout to 60 seconds.\n\nRequires an API\
        \ key passed in the `X-API-Key` header."
